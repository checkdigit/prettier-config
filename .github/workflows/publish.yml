name: Publish

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - "main"

jobs:
  publish:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Publish Release' || 'Publish Beta' }}
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: publish-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          allow-licenses: ${{ vars.ALLOW_LICENSES }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - name: Use latest npm
        run: npm install --global npm@latest
      - name: Check Label
        if: github.event_name == 'pull_request'
        uses: checkdigit/github-actions/check-label@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Imports
        if: github.event_name == 'pull_request'
        uses: checkdigit/github-actions/check-imports@main
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Audit Signatures
        run: npm audit signatures
      - name: Run Test
        if: github.event_name == 'pull_request'
        run: npm run ci:test
      - name: Prepare Beta
        if: github.event_name == 'pull_request'
        id: prepare-beta
        uses: checkdigit/github-actions/prepare-beta@main
      - name: Publish Release
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --access public
      - name: Publish Beta
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BETA_PACKAGE: ${{ steps.prepare-beta.outputs.betaPackage }}
        run: |
          pack_metadata=$(npm pack --json --pack-destination "$RUNNER_TEMP")
          archive=$(jq -er '.[] | .filename' <<< "$pack_metadata")
          integrity=$(jq -er '.[] | .integrity' <<< "$pack_metadata")

          if ! published_integrity=$(npm view "$BETA_PACKAGE" dist.integrity --prefer-online 2>/dev/null); then
            if npm publish "$RUNNER_TEMP/$archive" --tag beta --access public; then
              exit 0
            else
              publish_status=$?
              # The same version may have been uploaded while this job was running.
              published_integrity=$(npm view "$BETA_PACKAGE" dist.integrity --prefer-online) || exit "$publish_status"
            fi
          fi

          if [[ "$published_integrity" != "$integrity" ]]; then
            echo "::error::$BETA_PACKAGE is already published with different contents."
            exit 1
          fi
          echo "$BETA_PACKAGE is already published with matching contents."
      - name: Validate Published Beta NPM Package
        if: github.event_name == 'pull_request'
        uses: checkdigit/github-actions/validate-npm-package@main
        with:
          betaPackage: ${{ steps.prepare-beta.outputs.betaPackage }}
        env:
          # The action writes an npmrc containing this variable; public downloads need no token.
          NPM_TOKEN: ""
      - name: Comment npm publish result
        if: github.event_name == 'pull_request'
        uses: checkdigit/github-actions/comment-npm-publish@main
        with:
          betaPackage: ${{ steps.prepare-beta.outputs.betaPackage }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
